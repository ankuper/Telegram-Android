name: Build T3ChatM APK

on:
  push:
    branches: [ t3chatm ]
    tags: [ 't3chatm-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager --install "ndk;21.4.7075529"

    - name: Download libteleproto3 Android from release.
      # Prebuilt per-ABI .a from the latest teleproto3 GitHub Release.
      # Built against Telegram-Android's own BoringSSL with T3_SHIM_SOCKS5=ON.
      # Headers are checked into this repo at TMessagesProj/jni/teleproto3/include/.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=lib-v0.8.0
        echo "Consuming prebuilt libteleproto3 $TAG (android)"
        gh release download "$TAG" --repo ankuper/teleproto3 \
          --pattern 'libteleproto3-android.zip' --output /tmp/t3-android.zip
        unzip -o /tmp/t3-android.zip -d TMessagesProj/jni/teleproto3/
        ls -lh TMessagesProj/jni/teleproto3/arm64-v8a/libteleproto3.a \
               TMessagesProj/jni/teleproto3/armeabi-v7a/libteleproto3.a \
               TMessagesProj/jni/teleproto3/x86_64/libteleproto3.a

    - name: Build Standalone APK
      env:
        T3_DEFAULT_PROXY_SECRET: ${{ secrets.T3_DEFAULT_PROXY_SECRET }}
      run: |
        if [ -z "$T3_DEFAULT_PROXY_SECRET" ]; then
          echo "::warning::T3_DEFAULT_PROXY_SECRET secret is empty — APK will ship WITHOUT a default proxy."
        fi
        ./gradlew TMessagesProj_AppStandalone:assembleAfatStandalone \
          -PT3_DEFAULT_PROXY_SECRET="$T3_DEFAULT_PROXY_SECRET"

    - name: Rename APK
      run: |
        APK_PATH=$(find . -name "app.apk" -path "*/standalone/*" | head -1)
        cp "$APK_PATH" T3ChatM-android-universal.apk
        ls -lh T3ChatM-android-universal.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: T3ChatM-android-universal
        path: T3ChatM-android-universal.apk

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/t3chatm-v')
      uses: softprops/action-gh-release@v2
      with:
        files: T3ChatM-android-universal.apk
        prerelease: true
        generate_release_notes: false
        body: |
          ## T3ChatM Android ${{ github.ref_name }}

          Branded Android build with teleproto3 support.

          ### How to install
          1. Download `T3ChatM-android-universal.apk`
          2. Enable "Install from unknown sources" in Settings
          3. Open the APK to install
          
          ### Details
          - Package: com.t3chatm.messenger
          - API ID: 32145947
          - Standalone build (all architectures)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
