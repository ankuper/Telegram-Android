name: Build T3ChatM APK

on:
  push:
    branches: [ t3chatm ]
    tags: [ 't3chatm-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager --install "ndk;21.4.7075529"
        echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

    - name: Download prebuilt libteleproto3 for Android ABIs
      # Consume the prebuilt per-ABI static libs from the latest teleproto3
      # GitHub Release — never build from source (single source of truth,
      # CLAUDE.md). Each android archive holds lib/libteleproto3.a + lib/include/;
      # the .a references BoringSSL symbols resolved at the app's final link
      # against TMessagesProj/jni/boringssl.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=$(gh release view --repo ankuper/teleproto3 --json tagName -q .tagName)
        echo "Consuming prebuilt libteleproto3 $TAG (android)"
        DEST="$GITHUB_WORKSPACE/TMessagesProj/jni/teleproto3"
        mkdir -p "$DEST/include"
        for abi in arm64-v8a armeabi-v7a x86_64; do
          gh release download "$TAG" --repo ankuper/teleproto3 \
            --pattern "libteleproto3-android-${abi}.tar.gz" --output "/tmp/t3-${abi}.tgz"
          rm -rf "/tmp/t3x-${abi}" && mkdir -p "/tmp/t3x-${abi}" "$DEST/${abi}"
          tar xzf "/tmp/t3-${abi}.tgz" -C "/tmp/t3x-${abi}"
          cp "/tmp/t3x-${abi}/lib/libteleproto3.a" "$DEST/${abi}/libteleproto3.a"
        done
        # Headers are arch-independent — install once from any ABI archive.
        cp -R "/tmp/t3x-arm64-v8a/lib/include/." "$DEST/include/"
        ls -lh "$DEST/arm64-v8a/libteleproto3.a" \
               "$DEST/armeabi-v7a/libteleproto3.a" \
               "$DEST/x86_64/libteleproto3.a"

    - name: Build Standalone APK
      env:
        T3_DEFAULT_PROXY_SECRET: ${{ secrets.T3_DEFAULT_PROXY_SECRET }}
      run: |
        if [ -z "$T3_DEFAULT_PROXY_SECRET" ]; then
          echo "::warning::T3_DEFAULT_PROXY_SECRET secret is empty — APK will ship WITHOUT a default proxy."
        fi
        ./gradlew TMessagesProj_AppStandalone:assembleAfatStandalone \
          -PT3_DEFAULT_PROXY_SECRET="$T3_DEFAULT_PROXY_SECRET"

    - name: Rename APK
      run: |
        APK_PATH=$(find . -name "app.apk" -path "*/standalone/*" | head -1)
        cp "$APK_PATH" T3ChatM-android-universal.apk
        ls -lh T3ChatM-android-universal.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: T3ChatM-android-universal
        path: T3ChatM-android-universal.apk

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/t3chatm-v')
      uses: softprops/action-gh-release@v2
      with:
        files: T3ChatM-android-universal.apk
        prerelease: true
        generate_release_notes: false
        body: |
          ## T3ChatM Android ${{ github.ref_name }}

          Branded Android build with teleproto3 support.

          ### How to install
          1. Download `T3ChatM-android-universal.apk`
          2. Enable "Install from unknown sources" in Settings
          3. Open the APK to install
          
          ### Details
          - Package: com.t3chatm.messenger
          - API ID: 32145947
          - Standalone build (all architectures)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
